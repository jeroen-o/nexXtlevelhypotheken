<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-label="NexXt Level Hypotheken">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e3160"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Navy plate -->
  <rect x="0" y="0" width="720" height="160" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="716" height="156" rx="13" fill="none" stroke="#2c4ba8" stroke-width="1"/>

  <!-- Wordmark: NexXt Level -->
  <g font-family="'Helvetica Neue','Arial Black',Arial,sans-serif" font-weight="900" letter-spacing="-1.5">
    <text x="36" y="92" font-size="62" fill="#ffffff">Ne</text>
    <text x="115" y="92" font-size="62" fill="url(#orangeGrad)">x</text>
    <text x="148" y="92" font-size="62" fill="url(#orangeGrad)">X</text>
    <text x="187" y="92" font-size="62" fill="#ffffff">t</text>
    <text x="225" y="92" font-size="62" fill="#ffffff">Level</text>
  </g>

  <!-- Tagline -->
  <text x="38" y="124" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600"
        letter-spacing="6" fill="#a8b8d8">HYPOTHEKEN</text>

  <line x1="38" y1="132" x2="190" y2="132" stroke="url(#orangeGrad)" stroke-width="1.6"/>

  <!-- Right-side icon: ascending bars + house roof + arrow -->
  <g transform="translate(560,30)">
    <rect x="0"  y="70" width="14" height="30" rx="2" fill="#ffffff" opacity="0.45"/>
    <rect x="20" y="55" width="14" height="45" rx="2" fill="#ffffff" opacity="0.7"/>
    <rect x="40" y="38" width="14" height="62" rx="2" fill="url(#orangeGrad)"/>
    <polygon points="38,38 47,18 56,38" fill="url(#orangeGrad)"/>
    <rect x="44" y="78" width="6" height="22" fill="#1e3160"/>
    <g transform="translate(82,30)" stroke="url(#orangeGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="0" y1="50" x2="35" y2="15"/>
      <polyline points="20,15 35,15 35,30"/>
    </g>
  </g>
</svg>
